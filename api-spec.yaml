components:
  schemas:
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          nullable: true
        refreshToken:
          type: string
          nullable: true
        user:
          $ref: '#/components/schemas/UserDto'
      additionalProperties: false
    CardCreateRequest:
      type: object
      properties:
        question:
          type: string
          nullable: true
        answer:
          type: string
          nullable: true
        hint:
          type: string
          nullable: true
        difficulty:
          type: integer
          format: int32
          nullable: true
        tags:
          type: string
          nullable: true
      additionalProperties: false
      example:
        question: Which status indicates a created resource?
        answer: 201 Created
        hint: A successful POST
        difficulty: 2
        tags: 'http,rest'
    CardDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        topicId:
          type: integer
          format: int32
        topicTitle:
          type: string
          nullable: true
        question:
          type: string
          nullable: true
        answer:
          type: string
          nullable: true
        hint:
          type: string
          nullable: true
        difficulty:
          type: integer
          format: int32
        tags:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        ease:
          type: number
          format: double
        intervalDays:
          type: integer
          format: int32
        reps:
          type: integer
          format: int32
        lapses:
          type: integer
          format: int32
        dueAt:
          type: string
          format: date-time
          nullable: true
        lastReviewedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    CardDtoListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CardDto'
          nullable: true
        links:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Link'
          nullable: true
        meta:
          $ref: '#/components/schemas/PagedMeta'
      additionalProperties: false
    CardImportDto:
      type: object
      properties:
        imported:
          type: integer
          format: int32
        cards:
          type: array
          items:
            $ref: '#/components/schemas/CardDto'
          nullable: true
      additionalProperties: false
    CardImportItem:
      type: object
      properties:
        question:
          type: string
          nullable: true
        answer:
